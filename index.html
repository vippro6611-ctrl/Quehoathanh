<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dương - Aura Bá Khí</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0c10, #1f2833, #0b0c10);
      --card-bg: rgba(31, 40, 51, 0.65);
      --card-border: rgba(102, 252, 241, 0.2);
      --primary: #66fcf1;
      --primary-hover: #45a29e;
      --accent: #ff007f;
      --text: #c5c6c7;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    canvas#particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      width: 90%;
      max-width: 800px;
      margin: 20px auto;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header Auth Bar */
    .auth-bar {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--white);
    }

    .auth-buttons button, .btn-action {
      background: linear-gradient(45deg, #45a29e, #66fcf1);
      border: none;
      color: #0b0c10;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-buttons button:hover, .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 12px var(--primary);
    }

    /* Main Dashboard */
    .dashboard-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      position: relative;
    }

    .aura-title {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary);
    }

    .aura-display {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--white);
      text-shadow: 0 0 20px var(--primary);
      margin: 10px 0;
    }

    .rank-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 0, 127, 0.2);
      border: 1px solid var(--accent);
      color: #ff66b2;
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    .progress-container {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-hover), var(--primary), var(--accent));
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.85rem;
      color: var(--text);
    }

    /* Clicker Area */
    .clicker-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }

    .btn-main-click {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, #66fcf1 0%, #1f2833 70%);
      border: 4px solid var(--primary);
      color: #0b0c10;
      font-size: 1.5rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(102, 252, 241, 0.4);
      transition: transform 0.05s ease, box-shadow 0.2s ease;
    }

    .btn-main-click:active {
      transform: scale(0.92);
      box-shadow: 0 0 50px var(--primary);
    }

    /* Cooldown Events Section */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .event-card {
      background: rgba(11, 12, 16, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .event-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .event-btn:disabled {
      background: #555;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Leaderboard */
    .leaderboard-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
    }

    .leaderboard-title {
      color: var(--primary);
      margin-bottom: 15px;
      font-size: 1.3rem;
      text-align: center;
    }

    .leaderboard-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 15px;
      background: rgba(11, 12, 16, 0.6);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .leaderboard-item:nth-child(1) { border-left: 4px solid #ffd700; }
    .leaderboard-item:nth-child(2) { border-left: 4px solid #c0c0c0; }
    .leaderboard-item:nth-child(3) { border-left: 4px solid #cd7f32; }

    /* Footer */
    footer {
      width: 100%;
      text-align: center;
      padding: 20px;
      z-index: 2;
      background: rgba(11, 12, 16, 0.8);
      border-top: 1px solid rgba(102, 252, 241, 0.1);
    }

    .footer-brand {
      color: var(--primary);
      font-weight: bold;
      font-size: 1.1rem;
      text-shadow: 0 0 10px var(--primary);
    }

    .footer-subtitle {
      color: var(--accent);
      font-size: 0.85rem;
      margin-top: 4px;
      font-style: italic;
    }

    /* Floating Text Animation */
    .floating-text {
      position: absolute;
      color: var(--primary);
      font-weight: bold;
      font-size: 1.5rem;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-50px); }
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #1f2833;
      border: 1px solid var(--primary);
      border-radius: 12px;
      padding: 25px;
      width: 90%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-content input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #45a29e;
      background: #0b0c10;
      color: white;
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>

  <div class="container">
    <!-- Auth Bar -->
    <div class="auth-bar">
      <span id="userStatus">Khách (Chưa đăng nhập)</span>
      <div class="auth-buttons">
        <button id="btnLoginModal">Đăng Nhập / Đăng Ký</button>
        <button id="btnLogout" style="display: none; background: #ff4d4d; color: white;">Đăng Xuất</button>
      </div>
    </div>

    <!-- Main Game Dashboard -->
    <div class="dashboard-card">
      <div class="aura-title">Sức Mạnh Aura</div>
      <div class="aura-display" id="auraDisplay">0</div>
      <div class="rank-badge" id="rankBadge">Thằng Nghèo 💸</div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText">0 / 100 AP để Thăng Cấp</div>

      <!-- Single Clicker Button -->
      <div class="clicker-section">
        <button class="btn-main-click" id="btnMainClick">+1 AURA</button>
      </div>

      <!-- 5-Minute Cooldown Events -->
      <h3 style="margin-top: 25px; color: var(--primary); text-align: left;">Sự Kiện & Thách Thức</h3>
      <div class="events-grid">
        <div class="event-card">
          <h4>Giải Luyện Aura</h4>
          <p>Nhận ngay +250 AP</p>
          <button class="event-btn" id="btnEvent1" onclick="triggerEvent(1, 250)">Tham Gia (+250 AP)</button>
          <small id="cd1" style="color: var(--accent);"></small>
        </div>
        <div class="event-card">
          <h4>Khảo Sát Đạo Tâm</h4>
          <p>Nhận ngay +500 AP</p>
          <button class="event-btn" id="btnEvent2" onclick="triggerEvent(2, 500)">Trả Lời (+500 AP)</button>
          <small id="cd2" style="color: var(--accent);"></small>
        </div>
      </div>
    </div>

    <!-- Realtime Leaderboard -->
    <div class="leaderboard-card">
      <div class="leaderboard-title">🏆 Bảng Xếp Hạng Bá Khí Global</div>
      <ul class="leaderboard-list" id="leaderboardList">
        <li style="text-align: center; padding: 10px;">Đang tải bảng xếp hạng...</li>
      </ul>
    </div>
  </div>

  <!-- Footer Banner -->
  <footer>
    <div class="footer-brand">Web By Meoww</div>
    <div class="footer-subtitle">dùng Auto click là Femboy~</div>
  </footer>

  <!-- Auth Modal -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <h3 style="color: var(--primary); text-align: center;" id="modalTitle">Đăng Nhập Tài Khoản</h3>
      <input type="email" id="authEmail" placeholder="Email của bạn..." />
      <input type="password" id="authPassword" placeholder="Mật khẩu..." />
      <button class="btn-action" id="btnAuthSubmit">Xác Nhận</button>
      <button style="background: transparent; border: none; color: var(--text); cursor: pointer;" id="btnToggleAuthMode">Chưa có tài khoản? Đăng ký ngay</button>
      <button style="background: transparent; border: none; color: #ff4d4d; cursor: pointer;" id="btnCloseModal">Đóng</button>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      collection, 
      onSnapshot, 
      query, 
      orderBy, 
      limit 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyAJMqGogLpTxIzkVl4ueKHHoEPoQhtsMS4",
      authDomain: "duong-603a4.firebaseapp.com",
      projectId: "duong-603a4",
      storageBucket: "duong-603a4.firebasestorage.app",
      messagingSenderId: "966073698541",
      appId: "1:966073698541:web:4290b11c483ee480d524e4",
      measurementId: "G-443TCR23C6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 10-Tier Rank System
    const RANKS = [
      { name: "Thằng Nghèo 💸", min: 0 },
      { name: "Dân Thường 🎒", min: 100 },
      { name: "Học Sinh Chăm Chỉ 📚", min: 500 },
      { name: "Tu Tiên Giả 🧘", min: 2000 },
      { name: "Cao Thủ Võ Lâm ⚔️", min: 5000 },
      { name: "Đại Gia Phố Núi 💰", min: 10000 },
      { name: "Bá Chủ Học Đường 👑", min: 25000 },
      { name: "Siêu Cấp AURA 🌟", min: 50000 },
      { name: "Thần Thoại Bá Khí ⚡", min: 100000 },
      { name: "Trần Bình Prime 2019💀", min: 500000 }
    ];

    // App State
    let auraPoints = 0;
    let currentUser = null;
    let isSyncInitialized = false;
    let syncTimer = null;
    let isRegisterMode = false;

    // Cooldown State (5 minutes = 300 seconds)
    const COOLDOWN_TIME = 300; 
    let cdTimer1 = null;
    let cdTimer2 = null;

    // Elements
    const auraDisplay = document.getElementById('auraDisplay');
    const rankBadge = document.getElementById('rankBadge');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const userStatus = document.getElementById('userStatus');
    const btnLoginModal = document.getElementById('btnLoginModal');
    const btnLogout = document.getElementById('btnLogout');
    const leaderboardList = document.getElementById('leaderboardList');

    // Web Audio Sound Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // Rank Calculation & UI Update
    function updateUI() {
      auraDisplay.innerText = auraPoints.toLocaleString();

      let currentRankIndex = 0;
      for (let i = RANKS.length - 1; i >= 0; i--) {
        if (auraPoints >= RANKS[i].min) {
          currentRankIndex = i;
          break;
        }
      }

      const currentRank = RANKS[currentRankIndex];
      const nextRank = RANKS[currentRankIndex + 1];

      rankBadge.innerText = currentRank.name;

      if (nextRank) {
        const range = nextRank.min - currentRank.min;
        const progress = auraPoints - currentRank.min;
        const pct = Math.min(100, Math.max(0, (progress / range) * 100));
        progressBar.style.width = pct + "%";
        progressText.innerText = `${auraPoints.toLocaleString()} / ${nextRank.min.toLocaleString()} AP để Thăng Cấp`;
      } else {
        progressBar.style.width = "100%";
        progressText.innerText = "Đã đạt cấp độ Tối Cao!";
      }
    }

    // Cloud Firestore Sync (Debounced)
    function savePointsToCloud() {
      if (!currentUser || !isSyncInitialized) return;
      
      // Save locally per UID to isolate user data
      localStorage.setItem(`aura_${currentUser.uid}`, auraPoints);

      clearTimeout(syncTimer);
      syncTimer = setTimeout(async () => {
        try {
          await setDoc(doc(db, "leaderboard", currentUser.uid), {
            email: currentUser.email.split('@')[0],
            auraPoints: auraPoints,
            updatedAt: Date.now()
          }, { merge: true });
        } catch (e) {
          console.error("Firestore sync error:", e);
        }
      }, 500);
    }

    // Add Points Action
    function addAura(amount, e) {
      auraPoints += amount;
      updateUI();
      playClickSound();
      savePointsToCloud();

      if (e) {
        const rect = e.target.getBoundingClientRect();
        const text = document.createElement('div');
        text.className = 'floating-text';
        text.innerText = `+${amount}`;
        text.style.left = `${e.clientX - rect.left + (Math.random() * 20 - 10)}px`;
        text.style.top = `${e.clientY - rect.top}px`;
        e.target.parentElement.appendChild(text);
        setTimeout(() => text.remove(), 800);
      }
    }

    document.getElementById('btnMainClick').addEventListener('click', (e) => addAura(1, e));

    // Event Cooldown System (5 mins = 300s)
    window.triggerEvent = function(eventId, reward) {
      const btn = document.getElementById(`btnEvent${eventId}`);
      const label = document.getElementById(`cd${eventId}`);
      
      addAura(reward, null);
      btn.disabled = true;

      let remaining = COOLDOWN_TIME;
      const interval = setInterval(() => {
        remaining--;
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        label.innerText = `⏳ Hồi chiêu: ${mins}m ${secs}s`;

        if (remaining <= 0) {
          clearInterval(interval);
          btn.disabled = false;
          label.innerText = "";
        }
      }, 1000);
    };

    // Global Leaderboard Stream
    function listenLeaderboard() {
      const q = query(collection(db, "leaderboard"), orderBy("auraPoints", "desc"), limit(20));
      onSnapshot(q, (snapshot) => {
        leaderboardList.innerHTML = "";
        let rank = 1;
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const li = document.createElement('li');
          li.className = 'leaderboard-item';
          li.innerHTML = `
            <span><strong>#${rank}</strong> ${data.email || 'Người Chơi'}</span>
            <span style="color: var(--primary); font-weight: bold;">${(data.auraPoints || 0).toLocaleString()} AP</span>
          `;
          leaderboardList.appendChild(li);
          rank++;
        });
      });
    }

    // Auth State Handler (Crucial fix for point inheritance on new login)
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        userStatus.innerText = `👤 ${user.email.split('@')[0]}`;
        btnLoginModal.style.display = "none";
        btnLogout.style.display = "block";

        // Read user's isolated score from Firestore
        const userDocRef = doc(db, "leaderboard", user.uid);
        const docSnap = await getDoc(userDocRef);

        if (docSnap.exists()) {
          auraPoints = docSnap.data().auraPoints || 0;
        } else {
          // BRAND NEW ACCOUNT: Reset to 0 explicitly
          auraPoints = 0;
          await setDoc(userDocRef, {
            email: user.email.split('@')[0],
            auraPoints: 0,
            updatedAt: Date.now()
          });
        }

        isSyncInitialized = true;
        updateUI();
      } else {
        currentUser = null;
        userStatus.innerText = "Khách (Chưa đăng nhập)";
        btnLoginModal.style.display = "block";
        btnLogout.style.display = "none";
        
        // Reset points for guest / logout
        auraPoints = 0;
        isSyncInitialized = false;
        updateUI();
      }
    });

    // Auth Modal Actions
    const modal = document.getElementById('authModal');
    btnLoginModal.onclick = () => modal.style.display = "flex";
    document.getElementById('btnCloseModal').onclick = () => modal.style.display = "none";

    document.getElementById('btnToggleAuthMode').onclick = () => {
      isRegisterMode = !isRegisterMode;
      document.getElementById('modalTitle').innerText = isRegisterMode ? "Đăng Ký Tài Khoản" : "Đăng Nhập Tài Khoản";
      document.getElementById('btnToggleAuthMode').innerText = isRegisterMode ? "Đã có tài khoản? Đăng nhập" : "Chưa có tài khoản? Đăng ký ngay";
    };

    document.getElementById('btnAuthSubmit').onclick = async () => {
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPassword').value.trim();

      if (!email || !pass) return alert("Vui lòng nhập đầy đủ Email và Mật khẩu!");

      try {
        if (isRegisterMode) {
          await createUserWithEmailAndPassword(auth, email, pass);
          alert("Đăng ký thành công!");
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
        modal.style.display = "none";
      } catch (err) {
        alert("Lỗi: " + err.message);
      }
    };

    btnLogout.onclick = () => {
      signOut(auth);
      alert("Đã đăng xuất!");
    };

    // Canvas Background Animation
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        speedY: Math.random() * 0.5 + 0.1
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(102, 252, 241, 0.3)";
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        p.y -= p.speedY;
        if (p.y < 0) p.y = canvas.height;
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Start Leaderboard Realtime Listener
    listenLeaderboard();
  </script>
</body>
</html>
